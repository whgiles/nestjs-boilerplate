projectId: "<PROD_PROJECT_ID>"
region: "us-central1"
service:
  name: "oc-backend-service"
  accountEmail: "cloud-run-sa@<PROD_PROJECT_ID>.iam.gserviceaccount.com"
  allowUnauthenticated: true
  ingress: "all"
  timeoutSeconds: 300
  concurrency: 80
  minInstances: 1
  maxInstances: 5
  cpu: 1
  memory: "512Mi"
  vpcAccess:
    connector: "projects/<PROD_PROJECT_ID>/locations/us-central1/connectors/<CONNECTOR_NAME>"
    egress: "private-ranges-only"
  env:
    - name: "NODE_ENV"
      value: "production"
    - name: "DB_HOST"
      secret:
        name: "db-host"
        version: "latest"
        projectId: "<PROD_PROJECT_ID>"
    - name: "DB_PASSWORD"
      secret:
        name: "db-password"
        version: "latest"
        projectId: "<PROD_PROJECT_ID>"
image:
  repository: "us-central1-docker.pkg.dev/<PROD_PROJECT_ID>/backend-docker/oc-backend-service"
  tag: "latest"
