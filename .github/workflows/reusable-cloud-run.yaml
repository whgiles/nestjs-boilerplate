name: reusable-cloud-run

on:
  workflow_call:
    inputs:
      env_name:
        description: "Logical environment name (e.g., dev, stg, prod)"
        required: true
        type: string
      project_id:
        description: "GCP project ID for this deployment"
        required: true
        type: string
      region:
        description: "Cloud Run/Artifact Registry region"
        required: true
        type: string
      service_name:
        description: "Cloud Run service name"
        required: true
        type: string
      artifact_repo:
        description: "Artifact Registry repository name (Docker format)"
        required: true
        type: string
      image_name:
        description: "Image name within the Artifact Registry repo"
        required: true
        type: string
      values_file:
        description: "Path to the Helm values file for this environment"
        required: true
        type: string
      allow_unauthenticated:
        description: "Grant allUsers Cloud Run Invoker after deploy"
        required: true
        type: boolean
      run_tests:
        description: "Set to true to run tests before build/deploy"
        required: true
        type: boolean
      workload_identity_provider:
        description: "Workload Identity Provider resource name"
        required: true
        type: string
      service_account_email:
        description: "Service account email with deploy permissions"
        required: true
        type: string
      audience:
        description: "Audience for OIDC token (optional)"
        required: false
        type: string
    secrets: {}

permissions:
  contents: read
  id-token: write

jobs:
  build-test-deploy:
    name: Build, Test (optional), Push, Deploy (${{ inputs.env_name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    env:
      IMAGE: "${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.artifact_repo }}/${{ inputs.image_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: inputs.run_tests == true
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: inputs.run_tests == true
        run: npm install

      - name: Run tests
        if: inputs.run_tests == true
        run: npm run test:cov

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account_email }}
          project_id: ${{ inputs.project_id }}
          token_format: "access_token"
          audience: ${{ inputs.audience }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${{ inputs.region }}-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Render Cloud Run manifest
        run: |
          helm template "${{ inputs.service_name }}" deployments/chart \
            --values "${{ inputs.values_file }}" \
            --set projectId="${{ inputs.project_id }}" \
            --set region="${{ inputs.region }}" \
            --set image.repository="${IMAGE}" \
            --set image.tag="${GITHUB_SHA}" \
            > rendered-cloud-run.yaml

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace rendered-cloud-run.yaml \
            --project "${{ inputs.project_id }}" \
            --region "${{ inputs.region }}"

      - name: Allow unauthenticated access (if configured)
        if: inputs.allow_unauthenticated == true
        run: |
          gcloud run services add-iam-policy-binding "${{ inputs.service_name }}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --project "${{ inputs.project_id }}" \
            --region "${{ inputs.region }}"
